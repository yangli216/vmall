services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: pandou-test-only
    ports:
      - "127.0.0.1:33316:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppandou-test-only"]
      interval: 3s
      timeout: 2s
      retries: 30
